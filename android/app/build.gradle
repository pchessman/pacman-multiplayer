import org.gradle.api.tasks.util.PatternFilterable

plugins {
    id 'com.android.application'
}

// The game itself is the web app in the repository root; it is copied into the
// APK's assets at build time so there is a single source of truth.
abstract class WebAssetsTask extends DefaultTask {
    @Internal
    abstract DirectoryProperty getWebRoot()

    @Input
    abstract ListProperty<String> getIncludes()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    FileTree getSources() {
        // read the list out here: inside the closure `includes` would mean the pattern's own
        List<String> wanted = includes.get()
        return webRoot.get().asFileTree.matching { PatternFilterable p -> p.include(wanted) }
    }

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void copy() {
        def src = sources
        def dest = outputDir.dir('www')
        fs.sync { CopySpec spec ->
            spec.from(src)
            spec.into(dest)
        }
    }
}

def webAssets = tasks.register('copyWebAssets', WebAssetsTask) {
    webRoot = rootProject.file('..')
    includes = ['index.html', 'style.css', 'js/**', 'fonts/**', 'sounds/**']
}

android {
    namespace = 'io.github.pchessman.pacmanversus'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.pchessman.pacmanversus'
        minSdk = 24        // androidx.webkit 1.16 needs Android 7.0+
        targetSdk = 37     // Android 17
        versionCode = 2
        versionName = '2.0'
    }

    // Optional stable signing key from the environment (see README). Without it
    // the release build is signed with the debug key so it can still be sideloaded.
    def ks = System.getenv('PACVS_KEYSTORE')
    signingConfigs {
        if (ks) {
            release {
                storeFile = file(ks)
                storePassword = System.getenv('PACVS_STORE_PASSWORD')
                keyAlias = System.getenv('PACVS_KEY_ALIAS')
                keyPassword = System.getenv('PACVS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 shrinks and optimises the small Java wrapper; the game is untouched assets.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig = ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(webAssets) { it.outputDir }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.16.0'
}
