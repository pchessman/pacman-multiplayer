<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Lock-down: only this game's own files may load. No inline or remote code,
       no network requests, no plugins, no forms, no base-URL tricks. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Pac-Man Versus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-lights="idle">
  <main id="cabinet">
    <div id="bezel">
      <div id="lights" aria-hidden="true"></div>
      <div id="screen">
        <canvas id="game" width="448" height="576" aria-label="Pac-Man Versus game screen"></canvas>
        <div id="crt" aria-hidden="true"></div>
      </div>
    </div>
    <p id="help">
      <span class="pac">PAC-MAN: W A S D</span>
      <span class="ghost" id="help-p2">GHOST: ARROWS</span>
      <span>P: PAUSE</span>
      <span>M: MUTE</span>
      <span>F: FULLSCREEN</span>
    </p>
  </main>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/data.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/actors.js"></script>
  <script src="js/cutscenes.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/input.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
