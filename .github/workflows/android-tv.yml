name: Android TV APK

# Builds the Google TV / Android TV app (android/) around the web game and
# publishes the APK as a downloadable workflow artifact.
on:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - 'fonts/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Refuse to run a gradle-wrapper.jar that isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android 17 (API 37). The Android Gradle plugin can fetch it too, but asking
      # for it up front gives a clearer error if the package name ever changes.
      - name: Android 17 SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u | head -n 10 || true
          timeout 300 "$SDKM" --install "platforms;android-37.0" \
            || timeout 300 "$SDKM" --install "platforms;android-37" \
            || echo "platform not pre-installed; the Gradle plugin will download it"

      # Optional: a stable signing key, so new versions install over old ones
      # (and keep high scores). Without these secrets the APK is signed with a
      # throwaway debug key, which is fine for a first install.
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PACVS_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PACVS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          PACVS_STORE_PASSWORD: ${{ secrets.PACVS_STORE_PASSWORD }}
          PACVS_KEY_ALIAS: ${{ secrets.PACVS_KEY_ALIAS }}
          PACVS_KEY_PASSWORD: ${{ secrets.PACVS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease

      - name: Check the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|leanback|launchable-activity|uses-permission" || true
          # built for Android 17
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'37'"
          "$BT/apksigner" verify --print-certs "$APK" | head -n 3
          # the game files must be inside the APK, and the app must not ask for the network
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "assets/www/js/input.js"
          unzip -l "$APK" | grep -q "assets/www/js/controls.js"
          if "$BT/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then echo "unexpected INTERNET permission"; exit 1; fi
          mv "$APK" PacManVersus-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PacManVersus-TV
          path: PacManVersus-TV.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  # Installs the APK on an Android 17 emulator and starts it, so an install
  # problem shows up here with Android's exact reason (INSTALL_FAILED_...).
  install-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PacManVersus-TV

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android 17 emulator
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$SDKM" --list 2>/dev/null | grep -oE "system-images;android-37[^;| ]*;[a-z_]+;x86_64" | sort -u > images.txt || true
          cat images.txt
          IMG=$(grep -m1 ";google_apis;x86_64" images.txt || grep -m1 ";default;x86_64" images.txt || head -n1 images.txt)
          test -n "$IMG" || { echo "no Android 17 x86_64 system image listed"; exit 1; }
          echo "Using $IMG"
          timeout 1200 "$SDKM" --install "$IMG" "emulator" "platform-tools" > /dev/null
          echo no | "$AVDM" create avd -n a17 -k "$IMG" --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd a17 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 > emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          timeout 600 "$ADB" wait-for-device
          timeout 900 bash -c "until [ \"\$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 5; done"
          echo "Android SDK level: $($ADB shell getprop ro.build.version.sdk)  release: $($ADB shell getprop ro.build.version.release)"

      - name: Install and launch the APK
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install -r PacManVersus-TV.apk 2>&1 | tee install.txt
          grep -q Success install.txt
          "$ADB" shell dumpsys package io.github.pchessman.pacmanversus | grep -E "versionCode|versionName|targetSdk|minSdk" | head -n 5
          "$ADB" logcat -c
          "$ADB" shell am start -W -n io.github.pchessman.pacmanversus/.MainActivity
          sleep 15
          "$ADB" exec-out screencap -p > running.png
          "$ADB" logcat -d | grep -E "AndroidRuntime|FATAL|PacManVersus|chromium.*(Uncaught|Error)" | tail -n 40 || true
          "$ADB" shell pidof io.github.pchessman.pacmanversus || { echo "app is not running"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android17-install-test
          path: |
            running.png
            install.txt
            emulator.log
          if-no-files-found: ignore
