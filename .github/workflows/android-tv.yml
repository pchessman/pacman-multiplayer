name: Android TV APK

# Builds the Google TV / Android TV app (android/) around the web game and
# publishes the APK as a downloadable workflow artifact.
on:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - 'fonts/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Refuse to run a gradle-wrapper.jar that isn't an official Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android 17 (API 37). The Android Gradle plugin can fetch it too, but asking
      # for it up front gives a clearer error if the package name ever changes.
      - name: Android 17 SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]" | sort -u | head -n 10 || true
          timeout 300 "$SDKM" --install "platforms;android-37.0" \
            || timeout 300 "$SDKM" --install "platforms;android-37" \
            || echo "platform not pre-installed; the Gradle plugin will download it"

      # Optional: a stable signing key, so new versions install over old ones
      # (and keep high scores). Without these secrets the APK is signed with a
      # throwaway debug key, which is fine for a first install.
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PACVS_KEYSTORE_B64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PACVS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          PACVS_STORE_PASSWORD: ${{ secrets.PACVS_STORE_PASSWORD }}
          PACVS_KEY_ALIAS: ${{ secrets.PACVS_KEY_ALIAS }}
          PACVS_KEY_PASSWORD: ${{ secrets.PACVS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease

      - name: Check the APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|leanback|launchable-activity|uses-permission" || true
          # built for Android 17
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'37'"
          "$BT/apksigner" verify --print-certs "$APK" | head -n 3
          # the game files must be inside the APK, and the app must not ask for the network
          unzip -l "$APK" | grep -q "assets/www/index.html"
          unzip -l "$APK" | grep -q "assets/www/js/input.js"
          unzip -l "$APK" | grep -q "assets/www/js/controls.js"
          if "$BT/aapt2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then echo "unexpected INTERNET permission"; exit 1; fi
          mv "$APK" PacManVersus-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PacManVersus-TV
          path: PacManVersus-TV.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
